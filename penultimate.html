<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bamssa Penultimate League Fantasy</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#0f1b3d;--mu:#5d6a8a;--ac:#1e47c8;--ac2:#e11d2e;--bd:#dbe1f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1226;--card:#141d3a;--tx:#eef2ff;--mu:#93a0c4;--bd:#25305a;--ac:#4d7cff;--ac2:#ff4560}}
:root[data-theme="dark"]{--bg:#0b1226;--card:#141d3a;--tx:#eef2ff;--mu:#93a0c4;--bd:#25305a;--ac:#4d7cff;--ac2:#ff4560}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin:auto;padding:12px 12px 80px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mu);font-size:13px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
.tabs button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:10px;font:inherit;cursor:pointer;white-space:nowrap}
.tabs button.on,.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.mu{color:var(--mu);font-size:12px}.pts{font-weight:700;color:var(--ac)}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
.badge{background:var(--ac2);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.sm{padding:5px 9px;font-size:13px}
.bt{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.g6{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.g6 input{padding:6px 2px;text-align:center;margin:2px 0}
.hd{display:flex;gap:10px;align-items:center}.hd img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--ac2)}.dl{border-left:4px solid var(--ac2)}
.ed{border:1px dashed var(--ac);border-radius:10px;padding:8px;margin:8px 0}
.av{display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid #fff;object-fit:cover;margin:0 auto;color:#fff;font-weight:700;flex:none;background:#fff}
.av.ghost{background:#ffffff33;border:2px dashed #ffffffaa;font-size:20px}
.lf{display:flex;align-items:center;gap:10px}
.shot{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px;margin:8px 0}
.sh{display:flex;align-items:center;gap:10px;padding:2px 4px 8px}.sh img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--ac2)}.big{font-size:26px;line-height:1}
.pitch{position:relative;background:repeating-linear-gradient(180deg,#2e9e4f 0 12.5%,#35ab59 12.5% 25%);border-radius:12px;padding:10px 2px 6px;overflow:hidden;border:2px solid #ffffff44}
.pitch::before{content:"";position:absolute;left:50%;top:52%;width:96px;height:96px;border:2px solid #ffffff55;border-radius:50%;transform:translate(-50%,-50%)}
.pitch::after{content:"";position:absolute;left:25%;top:0;width:50%;height:56px;border:2px solid #ffffff55;border-top:none}
.pr{display:flex;justify-content:space-around;margin:10px 0;position:relative;z-index:1}
.pl{position:relative;width:76px;text-align:center;cursor:pointer;border-radius:10px;padding:2px 0}
.pl.ro{cursor:default}
.pl.on{outline:2px solid #ffd400;background:#ffffff22}
.pn{background:#fff;color:#111;font-size:11px;font-weight:700;border-radius:6px 6px 0 0;padding:1px 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.pt{background:#0f1b3d;color:#fff;font-size:11px;font-weight:700;border-radius:0 0 6px 6px;padding:1px 3px}
.cb{position:absolute;top:0;right:8px;background:#111;color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:700;line-height:18px;z-index:2}
.bench{background:linear-gradient(180deg,#2e9e4f,#278a44);border-radius:12px;margin-top:6px;padding:4px 2px 2px}
.bench .mu{color:#fff;padding:2px 8px}
.mr{cursor:pointer;padding:6px 0;border-bottom:1px solid var(--bd)}
</style></head><body>
<div class="hd"><img alt="BAMSSA" src="IMG_5672.jpeg"><div><h1>Penultimate League Fantasy</h1>
<div class="sub">Pick 15 players (11 + 4 subs) · choose your formation · £100m · max 3 per department · captain scores double</div></div></div>
<div id="app">Loading…</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,doc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,writeBatch}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBcns1OW82iioMRzdbBPJ2dOmNyRhVhgcQ",authDomain:"bamssa-fantasy-league.firebaseapp.com",projectId:"bamssa-fantasy-league",storageBucket:"bamssa-fantasy-league.firebasestorage.app",messagingSenderId:"644555872989",appId:"1:644555872989:web:be16b65ca48132983a5934"};
const ADMIN_PIN="2007",BUDGET=100,MAXD=3,END="Squad selection has ended";
const PC="plPlayers",MC="plManagers";
const REVEAL_BEFORE_DEADLINE=false;
const DEADLINE="2026-10-24T11:00:00+01:00";
const DL=DEADLINE?new Date(DEADLINE).getTime():null;
const locked=()=>DL!==null&&Date.now()>DL;
function left(){let m=Math.max(0,Math.floor((DL-Date.now())/60000)),d=Math.floor(m/1440),h=Math.floor(m%1440/60);return d>0?d+"d "+h+"h left":h+"h "+(m%60)+"m left"}
const DEPTS=["Anatomy","Forensics","Medicine","MLS","Physiology","Pharmacy","Pharmacology"];
const COACH={Anatomy:"Wale",Forensics:"Adekola",Medicine:"David",MLS:"Oluwanifemi",Pharmacy:"TrexJnr",Pharmacology:"Khalifa"};
const SQ={
Anatomy:"Chris GK,Jeff DEF,Emmzy DEF,Fikayo DEF,Jelad DEF,Midex FWD,Isco MID,Kade FWD,Daud MID,Feranmi DEF,Cindy DEF,Tosin GK,Abbey MID,Taiwo DEF,Abdul FWD,Pesh MID,Jugzy DEF",
Forensics:"Tunmise GK,Samad DEF,Henork DEF,Bright DEF,Olayiwola MID,Samzany MID,Osaka MID,5 Star FWD,Umar FWD,Phenomenal FWD,Horla DEF,Tise DEF,Dreadman DEF,Chris FWD,Lampard Jnr DEF,Nuru Jnr FWD,Ife Jnr MID",
Medicine:"Kcee DEF,Xenolith DEF,Peco GK,Yummy DEF,Possibility DEF,Juwon DEF,Zebdiel MID,Hemxx MID,Tosin FWD,Enoch MID,Native MID,Kolade DEF,Jay Jay MID,Fredrick FWD,Molan GK,Favour FWD,Ilyas FWD",
MLS:"Hameed DEF,Shoki FWD,Plus FWD,Leumas FWD,Drummer DEF,Farouk MID,Timothy FWD,Tosin FWD,Wale MID,Paparazzi GK,Ademola DEF,Hussein (200L) DEF,Ridwan DEF,Dia FWD,Charles FWD,Egbon MID,Idris GK",
Physiology:"Teni GK,Aomi GK,Mayowa DEF,Femi DEF,Dimah MID,Ali DEF,Niffy FWD,Tobi MID,Deunald MID,Joe FWD,Adeniyi FWD,Itami FWD,Sammy FWD,Leke MID,Daniel MID,Bolu FWD,Tomiwa DEF",
Pharmacy:"Kathir GK,FM FWD,Waheed DEF,Toheeb FWD,Prose DEF,Mhidey FWD,Vivid DEF,Demmie MID,Ebuka DEF,Lopez FWD,Hash MID,Enzo MID,Sammie MID,Tobi MID,Certified MID,Malik FWD,Alfa DEF",
Pharmacology:"Vizzy V DEF,Silva MID,West Fargo DEF,Sodwaq FWD,Adeboye DEF,Jayden FWD,Koko P DEF,Mubby FWD,Cho bby MID,Dave DEF,Jazzy Jnr MID,David MID,Basit DEF,Gbolahan MID,Richykala MID,Pee Vibez DEF,Neutral GK"};
const POS=["GK","DEF","MID","FWD"],QUOTA={GK:2,DEF:5,MID:5,FWD:3};
const FORMS=["3-4-3","3-5-2","4-3-3","4-4-2","4-5-1","5-3-2","5-4-1"];
const GV={GK:10,DEF:10,MID:8,FWD:6},CSV={GK:6,DEF:6,MID:2,FWD:0};
const KEYS=["g","a","cs","ps","motm","ft","ht","pts"],LBL=["G","A","CS","PS","MOTM","FT","HT","±"];
let db,uid,players=[],mgrs=[],me=null,tab="team",admin=false,flt="All",fpos="All",ready=false,editId=null,aq="",adp="All",afp="All",apmin="",apmax="",asort="name",selId=null,viewId=null;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=id=>players.find(p=>p.id===id);
const pp=p=>(p.g||0)*GV[p.pos]+(p.a||0)*5+(p.cs||0)*CSV[p.pos]+(p.ps||0)*5+(p.motm||0)*5+(p.ft||0)*2+(p.ht||0)+(p.pts||0);
const FM=m=>(m.form||"4-4-2").split("-").map(Number);
const canSee=m=>m.id===uid||locked()||REVEAL_BEFORE_DEADLINE||admin;
function starters(m){return (m.squad||[]).filter(id=>!(m.bench||[]).includes(id)).map(P).filter(Boolean)}
function ok(m){const s=starters(m),c=k=>s.filter(p=>p.pos===k).length,[d,mi,f]=FM(m);return (m.squad||[]).length===15&&s.length===11&&c("GK")===1&&c("DEF")===d&&c("MID")===mi&&c("FWD")===f}
function score(m){return ok(m)?starters(m).reduce((t,p)=>t+pp(p)*(m.cap===p.id?2:1),0):0}
function cost(m){return (m.squad||[]).reduce((t,id)=>t+(P(id)?P(id).price:0),0)}
function arrange(form,m){const[d,mi,f]=form.split("-").map(Number),need={GK:1,DEF:d,MID:mi,FWD:f},st=[],bn=[],b0=m.bench||[];
  (m.squad||[]).map(P).filter(Boolean).sort((a,b)=>(b0.includes(a.id)-b0.includes(b.id))||b.price-a.price).forEach(p=>{if(need[p.pos]>0){need[p.pos]--;st.push(p.id)}else bn.push(p.id)});
  return{bench:bn,cap:st.includes(m.cap)?m.cap:null}}
const bl=()=>{const f=document.activeElement;f&&f.blur&&f.blur()};
const resizeImg=f=>new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=e=>{const im=new Image();im.onerror=rej;im.onload=()=>{const s=160,c=document.createElement("canvas");c.width=c.height=s;const m=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)*0.2,m,m,0,0,s,s);res(c.toDataURL("image/jpeg",0.75))};im.src=e.target.result};r.readAsDataURL(f)});
const dc=d=>`hsl(${((DEPTS.indexOf(d)+1)*51)%360},60%,42%)`;
const ini=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
function av(p,s){const st=`width:${s}px;height:${s}px`;return p.photo?`<img class="av" style="${st}" src="${p.photo}" alt="">`:`<div class="av" style="${st};background:${dc(p.dept)};font-size:${Math.round(s*.36)}px">${esc(ini(p.name))}</div>`}
const ghost=`<div class="pl ro"><div class="av ghost" style="width:52px;height:52px">+</div><div class="pn">Empty</div></div>`;
function pl(p,m,ro){const c=m.cap===p.id;return `<div class="pl ${ro?"ro":""} ${!ro&&selId===p.id?"on":""}" ${ro?"":`onclick="pick('${p.id}')"`}>${c?'<span class="cb">C</span>':""}${av(p,52)}<div class="pn">${esc(p.name)}</div><div class="pt">${pp(p)*(c?2:1)}</div></div>`}
function shotHTML(m,ro){const sq=m.squad||[],B=(m.bench||[]).map(P).filter(Boolean),S=starters(m),fm=m.form||"4-4-2",[d,mi,fw]=FM(m);
  const rows=[["GK",1],["DEF",d],["MID",mi],["FWD",fw]].map(([k,n])=>{const ps=S.filter(p=>p.pos===k);let x=ps.map(p=>pl(p,m,ro)).join("");for(let i=ps.length;i<n;i++)x+=ghost;return `<div class="pr">${x}</div>`}).join("");
  let bn=B.map(p=>pl(p,m,ro)).join("");for(let i=B.length;i<4;i++)bn+=ghost;
  return `<div class="shot"><div class="sh"><img src="IMG_5672.jpeg" alt=""><div style="flex:1;min-width:0"><b>${esc(m.name)}</b><div class="mu">${esc(m.dept)} · ${fm} · £${(BUDGET-cost(m)).toFixed(1)}m left · ${sq.length}/15</div></div><div class="pts big">${score(m)}</div></div><div class="pitch">${rows}</div><div class="bench"><div class="mu">SUBS</div><div class="pr">${bn}</div></div></div>`}
async function init(){
  try{
    db=getFirestore(initializeApp(firebaseConfig));
    uid=localStorage.getItem("bfl_uid");if(!uid){uid="u"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem("bfl_uid",uid)}
  }catch(e){$("#app").innerHTML='<div class="card">Setup error: check your Firebase config.</div>';return}
  const er=()=>{$("#app").innerHTML='<div class="card">Cannot reach the database. Check Firebase config and rules.</div>'};
  onSnapshot(collection(db,PC),s=>{players=s.docs.map(d=>({id:d.id,...d.data()}));ready=true;render()},er);
  onSnapshot(collection(db,MC),s=>{mgrs=s.docs.map(d=>({id:d.id,...d.data()}));me=mgrs.find(m=>m.id===uid)||null;ready=true;render()},er);
}
async function save(patch){try{await setDoc(doc(db,MC,uid),{...(me||{}),...patch})}catch(e){alert("Could not save, try again.")}}
function join(){if(locked())return alert(END);const n=$("#nm").value.trim(),d=$("#dp").value;if(!n)return alert("Enter your team name");bl();save({name:n,dept:d,squad:[],bench:[],cap:null,form:"4-4-2"})}
function toggle(id){if(locked())return alert(END);const sq=[...(me.squad||[])],bn=[...(me.bench||[])],i=sq.indexOf(id);
  if(i>=0){if(selId===id)selId=null;sq.splice(i,1);return save({squad:sq,bench:bn.filter(x=>x!==id),cap:me.cap===id?null:me.cap})}
  const p=P(id);if(sq.length>=15)return alert("Squad full (15 players)");
  const ps=sq.map(P).filter(Boolean);
  if(cost(me)+p.price>BUDGET)return alert("Over budget!");
  if(ps.filter(x=>x.pos===p.pos).length>=QUOTA[p.pos])return alert("You already have "+QUOTA[p.pos]+" "+p.pos);
  if(ps.filter(x=>x.dept===p.dept).length>=MAXD)return alert("Max "+MAXD+" players per department");
  sq.push(id);if(sq.length-bn.length>11)bn.push(id);save({squad:sq,bench:bn})}
function swap(id){if(locked())return alert(END);const bn=[...(me.bench||[])],i=bn.indexOf(id),st=(me.squad||[]).length-bn.length;
  if(i>=0){if(st>=11)return alert("Starting XI is full. Use Swap with to trade places with a starter.");bn.splice(i,1);return save({bench:bn})}
  if(bn.length>=4)return alert("Bench is full. Use Swap with to trade places with a sub.");
  bn.push(id);save({bench:bn,cap:me.cap===id?null:me.cap})}
function swap2(a,b){if(locked())return alert(END);let bn=[...(me.bench||[])];const ia=bn.indexOf(a)>=0,ib=bn.indexOf(b)>=0;if(ia===ib)return;
  const s=ia?b:a,u=ia?a:b;bn=bn.filter(x=>x!==u);bn.push(s);
  const st=(me.squad||[]).filter(id=>!bn.includes(id)).map(P).filter(Boolean),c=k=>st.filter(p=>p.pos===k).length,f=c("DEF")+"-"+c("MID")+"-"+c("FWD");
  const patch={bench:bn,cap:me.cap===s?null:me.cap};if(c("GK")===1&&FORMS.includes(f))patch.form=f;
  selId=null;save(patch)}
function cap(id){if(locked())return alert(END);if((me.bench||[]).includes(id))return alert("Captain must be in your starting XI");save({cap:id})}
function setForm(v){if(locked())return alert(END);save({form:v,...arrange(v,me)})}
function auto(){if(locked())return alert(END);save(arrange(me.form||"4-4-2",me))}
function pick(id){selId=(id===null||selId===id)?null:id;render(true)}
function view(id){if(id===null){viewId=null;return render(true)}const m=mgrs.find(x=>x.id===id);if(!m)return;
  if(!canSee(m))return alert("Squads are revealed to everyone after the deadline.");viewId=id;render(true);window.scrollTo(0,0)}
function pin(){if($("#pn").value===ADMIN_PIN){admin=true;render(true)}else alert("Wrong PIN")}
function seedList(){const out=[];Object.entries(SQ).forEach(([d,s])=>s.split(",").forEach((t,i)=>{t=t.trim();const k=t.lastIndexOf(" ");out.push({id:(d+"-"+i).toLowerCase(),name:t.slice(0,k),dept:d,pos:t.slice(k+1),price:5,photo:"",g:0,a:0,cs:0,ps:0,motm:0,ft:0,ht:0,pts:0})}));return out}
async function loadSquads(){const l=seedList().filter(x=>!players.some(p=>p.id===x.id));if(!l.length)return alert("All squad lists are already loaded.");
  if(!confirm("Add "+l.length+" players?"))return;let b=writeBatch(db),n=0;
  for(const x of l){const{id,...r}=x;b.set(doc(db,PC,id),r);if(++n%400===0){await b.commit();b=writeBatch(db)}}
  await b.commit();alert("Loaded "+l.length+" players")}
async function addP(){const n=$("#an").value.trim(),pr=parseFloat($("#ap").value),d=$("#ad").value;if(!n||!(pr>0))return alert("Fill name and price");
  if(players.some(p=>p.name.trim().toLowerCase()===n.toLowerCase()&&p.dept===d))return alert(n+" already exists in "+d+". Search for them below.");
  let photo="";const f=$("#aph").files[0];if(f){try{photo=await resizeImg(f)}catch(e){return alert("Could not read that photo")}}
  bl();await addDoc(collection(db,PC),{name:n,dept:d,pos:$("#apos").value,price:pr,photo,g:0,a:0,cs:0,ps:0,motm:0,ft:0,ht:0,pts:0});$("#an").value="";$("#aph").value=""}
async function upPhoto(id,el){const f=el.files[0];if(!f)return;try{const photo=await resizeImg(f);await updateDoc(doc(db,PC,id),{photo})}catch(e){alert("Could not upload photo")}el.value=""}
async function rmPhoto(id){await updateDoc(doc(db,PC,id),{photo:""})}
async function saveStats(id){const o={};KEYS.forEach(k=>o[k]=parseFloat($("#"+k+id).value)||0);bl();await updateDoc(doc(db,PC,id),o)}
function editP(id){editId=id;render(true)}
function cancelEdit(){editId=null;render(true)}
async function saveEdit(id){const n=$("#en"+id).value.trim(),pr=parseFloat($("#ep"+id).value);if(!n||!(pr>0))return alert("Fill name and price");bl();
  await updateDoc(doc(db,PC,id),{name:n,dept:$("#ed"+id).value,pos:$("#eps"+id).value,price:pr});editId=null;render(true)}
async function delP(id){if(confirm("Delete player?"))await deleteDoc(doc(db,PC,id))}
function filtered(){const q=aq.trim().toLowerCase(),lo=parseFloat(apmin),hi=parseFloat(apmax);
  return players.filter(p=>(adp==="All"||p.dept===adp)&&(afp==="All"||p.pos===afp)&&(!q||p.name.toLowerCase().includes(q))&&(isNaN(lo)||p.price>=lo)&&(isNaN(hi)||p.price<=hi))
    .sort((a,b)=>asort==="hi"?b.price-a.price:asort==="lo"?a.price-b.price:a.name.localeCompare(b.name))}
async function bulkPrice(){const pr=parseFloat($("#bp").value);if(!(pr>0))return alert("Type a price first");const l=filtered();if(!l.length)return alert("No players in the list");
  if(!confirm("Set £"+pr+"m for these "+l.length+" players?"))return;let b=writeBatch(db),n=0;
  for(const p of l){b.update(doc(db,PC,p.id),{price:pr});if(++n%400===0){await b.commit();b=writeBatch(db)}}
  await b.commit();bl()}
function pc(p,btn){return `<div class="card row"><div class="lf">${av(p,40)}<div><b>${esc(p.name)}</b> <span class="mu">${p.pos} · ${esc(p.dept)}</span><div class="mu">£${p.price}m · ${p.g||0}G ${p.a||0}A ${p.cs||0}CS ${p.ps||0}PS ${p.motm||0}MOTM ${p.ft||0}FT ${p.ht||0}HT · <span class="pts">${pp(p)} pts</span></div></div></div>${btn}</div>`}
function opts(list,sel){return `<option>All</option>`+list.map(d=>`<option ${sel===d?"selected":""}>${d}</option>`).join("")}
function sel(list,val){return list.map(d=>`<option ${val===d?"selected":""}>${d}</option>`).join("")}
function adminCard(p){return `<div class="card"><div class="row"><div class="lf">${av(p,40)}<b>${esc(p.name)}</b></div><span class="mu">${p.pos} · ${esc(p.dept)} · £${p.price}m · ${pp(p)} pts</span></div>${editId===p.id?`<div class="ed"><div class="mu">Edit details</div><input id="en${p.id}" value="${esc(p.name)}" placeholder="Name"><select id="ed${p.id}">${sel(DEPTS,p.dept)}</select><select id="eps${p.id}">${sel(POS,p.pos)}</select><input id="ep${p.id}" type="number" step="0.5" value="${p.price}" placeholder="Price (£m)"><div class="row"><button class="btn p sm" onclick="saveEdit('${p.id}')">Save details</button><button class="btn sm" onclick="cancelEdit()">Cancel</button></div></div>`:""}<div class="g6">${KEYS.map((k,i)=>`<label class="mu">${LBL[i]}<input id="${k}${p.id}" type="number" value="${p[k]||0}"></label>`).join("")}</div><div class="row"><button class="btn p sm" onclick="saveStats('${p.id}')">Save stats</button><div class="bt"><label class="btn sm">📷 Photo<input type="file" accept="image/*" style="display:none" onchange="upPhoto('${p.id}',this)"></label>${p.photo?`<button class="btn sm" onclick="rmPhoto('${p.id}')">No photo</button>`:""}<button class="btn sm" onclick="editP('${p.id}')">Edit details</button><button class="btn sm" onclick="delP('${p.id}')">✕ Delete</button></div></div></div>`}
function adminList(){const l=filtered();return `<div class="mu">Showing ${l.length} of ${players.length}</div>`+(l.map(adminCard).join("")||'<div class="mu">No players match.</div>')}
function refresh(){const e=$("#al");if(e)e.innerHTML=adminList()}

function setAmin(v){apmin=v;refresh()}function setAmax(v){apmax=v;refresh()}function setAs(v){asort=v;refresh()}
