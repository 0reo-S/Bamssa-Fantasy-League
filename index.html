<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bamssa Fantasy League</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#14231a;--mu:#6b7a70;--ac:#0a8f4e;--ac2:#f2b705;--bd:#dfe5e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1612;--card:#17221c;--tx:#eaf3ed;--mu:#8da296;--bd:#26362d}}
:root[data-theme="dark"]{--bg:#0e1612;--card:#17221c;--tx:#eaf3ed;--mu:#8da296;--bd:#26362d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin:auto;padding:12px 12px 80px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mu);font-size:13px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
.tabs button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:10px;font:inherit;cursor:pointer;white-space:nowrap}
.tabs button.on,.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.mu{color:var(--mu);font-size:12px}.pts{font-weight:700;color:var(--ac)}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
.badge{background:var(--ac2);color:#222;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.sm{padding:5px 9px;font-size:13px}
.x{overflow-x:auto}
</style></head><body>
<h1>⚽ Bamssa Fantasy League</h1>
<div class="sub">Pick 7 players · £100m budget · max 2 per department · captain scores double</div>
<div id="app">Loading…</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,doc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBcns1OW82iioMRzdbBPJ2dOmNyRhVhgcQ",authDomain:"bamssa-fantasy-league.firebaseapp.com",projectId:"bamssa-fantasy-league",storageBucket:"bamssa-fantasy-league.firebasestorage.app",messagingSenderId:"644555872989",appId:"1:644555872989:web:be16b65ca48132983a5934"};
const ADMIN_PIN="2007";
const DEPTS=["Pharmacology","Physiology","MLS","Forensics","Anatomy","Nursing","Biochemistry"];
const POS=["GK","DEF","MID","FWD"];
let db,uid,players=[],mgrs=[],me=null,tab="team",admin=false,flt="All",ready=false;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=id=>players.find(p=>p.id===id);
function score(m){return (m.squad||[]).reduce((t,id)=>{const p=P(id);return t+(p?(p.pts||0)*(m.cap===id?2:1):0)},0)}
function cost(m){return (m.squad||[]).reduce((t,id)=>t+(P(id)?P(id).price:0),0)}
async function init(){
  try{
    db=getFirestore(initializeApp(firebaseConfig));
    uid=localStorage.getItem("bfl_uid");if(!uid){uid="u"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem("bfl_uid",uid)}
  }catch(e){$("#app").innerHTML='<div class="card">Setup error: check your Firebase config.</div>';return}
  const er=()=>{$("#app").innerHTML='<div class="card">Cannot reach the database. Check Firebase config and rules.</div>'};
  onSnapshot(collection(db,"players"),s=>{players=s.docs.map(d=>({id:d.id,...d.data()}));ready=true;render()},er);
  onSnapshot(collection(db,"managers"),s=>{mgrs=s.docs.map(d=>({id:d.id,...d.data()}));me=mgrs.find(m=>m.id===uid)||null;ready=true;render()},er);
}
async function save(patch){try{await setDoc(doc(db,"managers",uid),{...(me||{}),...patch})}catch(e){alert("Could not save, try again.")}}
function join(){const n=$("#nm").value.trim(),d=$("#dp").value;if(!n)return alert("Enter your team name");save({name:n,dept:d,squad:[],cap:null})}
function toggle(id){const sq=[...(me.squad||[])];const i=sq.indexOf(id);
  if(i>=0){sq.splice(i,1);return save({squad:sq,cap:me.cap===id?null:me.cap})}
  const p=P(id);if(sq.length>=7)return alert("Squad full (7 players)");
  if(cost(me)+p.price>100)return alert("Over budget!");
  if(sq.filter(x=>P(x)&&P(x).dept===p.dept).length>=2)return alert("Max 2 players per department");
  sq.push(id);save({squad:sq})}
function cap(id){save({cap:id})}
function pin(){if($("#pn").value===ADMIN_PIN){admin=true;render()}else alert("Wrong PIN")}
async function addP(){const n=$("#an").value.trim(),pr=parseFloat($("#ap").value);if(!n||!(pr>0))return alert("Fill name and price");
  await addDoc(collection(db,"players"),{name:n,dept:$("#ad").value,pos:$("#apos").value,price:pr,pts:0});$("#an").value=""}
async function addPts(id){const v=parseFloat($("#pt"+id).value);if(isNaN(v))return;const p=P(id);await updateDoc(doc(db,"players",id),{pts:(p.pts||0)+v});$("#pt"+id).value=""}
async function delP(id){if(confirm("Delete player?"))await deleteDoc(doc(db,"players",id))}
function pc(p,btn){return `<div class="card row"><div><b>${esc(p.name)}</b> <span class="mu">${p.pos} · ${esc(p.dept)}</span><div class="mu">£${p.price}m · <span class="pts">${p.pts||0} pts</span></div></div>${btn}</div>`}
function render(){
  const a=$("#app");if(!db||!ready)return;
  const tb=[["team","My Team"],["players","Players"],["table","Table"],["admin","Admin"]].map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="setTab('${k}')">${l}</button>`).join("");
  let h=`<div class="tabs">${tb}</div>`;
  if(tab==="team"){
    if(!me)h+=`<div class="card"><b>Create your team</b><input id="nm" placeholder="Team name" maxlength="24"><select id="dp">${DEPTS.map(d=>`<option>${d}</option>`).join("")}</select><button class="btn p" onclick="join()">Join league</button></div>`;
    else{h+=`<div class="card row"><div><b>${esc(me.name)}</b><div class="mu">${esc(me.dept)} · £${(100-cost(me)).toFixed(1)}m left · ${(me.squad||[]).length}/7</div></div><div class="pts" style="font-size:22px">${score(me)}</div></div>`;
      h+=(me.squad||[]).map(id=>{const p=P(id);return p?pc(p,`<div>${me.cap===id?'<span class="badge">C</span> ':`<button class="btn sm" onclick="cap('${id}')">Captain</button> `}<button class="btn sm" onclick="toggle('${id}')">Remove</button></div>`):""}).join("")||'<div class="mu">No players yet. Open the Players tab.</div>'}
  }
  if(tab==="players"){
    h+=`<select onchange="setFlt(this.value)"><option>All</option>${DEPTS.map(d=>`<option ${flt===d?"selected":""}>${d}</option>`).join("")}</select>`;
    const l=players.filter(p=>flt==="All"||p.dept===flt).sort((a,b)=>b.price-a.price);
    h+=l.map(p=>pc(p,me?`<button class="btn sm ${(me.squad||[]).includes(p.id)?"":"p"}" onclick="toggle('${p.id}')">${(me.squad||[]).includes(p.id)?"Remove":"Add"}</button>`:"")).join("")||'<div class="mu">No players yet. The admin adds them.</div>'}
  if(tab==="table"){
    const r=[...mgrs].filter(m=>m.name).sort((a,b)=>score(b)-score(a));
    h+=`<div class="card"><b>Managers</b>`+(r.map((m,i)=>`<div class="row"><span>${i+1}. ${esc(m.name)} <span class="mu">${esc(m.dept)}</span></span><span class="pts">${score(m)}</span></div>`).join("")||'<div class="mu">No managers yet</div>')+`</div>`;
    const d=DEPTS.map(x=>[x,mgrs.filter(m=>m.dept===x).reduce((t,m)=>t+score(m),0),mgrs.filter(m=>m.dept===x).length]).sort((a,b)=>b[1]-a[1]);
    h+=`<div class="card"><b>Department standings</b>`+d.map((x,i)=>`<div class="row"><span>${i+1}. ${x[0]} <span class="mu">${x[2]} mgrs</span></span><span class="pts">${x[1]}</span></div>`).join("")+`</div>`}
  if(tab==="admin"){
    if(!admin)h+=`<div class="card"><b>Admin PIN</b><input id="pn" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN"><button class="btn p" onclick="pin()">Unlock</button></div>`;
    else{h+=`<div class="card"><b>Add player</b><input id="an" placeholder="Player name"><select id="ad">${DEPTS.map(d=>`<option>${d}</option>`).join("")}</select><select id="apos">${POS.map(d=>`<option>${d}</option>`).join("")}</select><input id="ap" type="number" step="0.5" placeholder="Price (£m)"><button class="btn p" onclick="addP()">Add</button></div><div class="card"><b>Gameweek points</b><div class="mu">Enter points (negatives allowed) and tap Add.</div></div>`;
      h+=players.map(p=>`<div class="card"><div class="row"><b>${esc(p.name)}</b><span class="mu">${esc(p.dept)} · ${p.pts||0} pts</span></div><div class="row"><input id="pt${p.id}" type="number" placeholder="+pts"><button class="btn p sm" onclick="addPts('${p.id}')">Add</button><button class="btn sm" onclick="delP('${p.id}')">✕</button></div></div>`).join("")}
  }
    a.innerHTML=h;
}
function setTab(k){tab=k;render()}function setFlt(v){flt=v;render()}
Object.assign(window,{join,toggle,cap,pin,addP,addPts,delP,setTab,setFlt});
init();
</script></body></html>
