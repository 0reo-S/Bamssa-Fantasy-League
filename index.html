<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bamssa Fantasy League</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#0f1b3d;--mu:#5d6a8a;--ac:#1e47c8;--ac2:#e11d2e;--bd:#dbe1f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1226;--card:#141d3a;--tx:#eef2ff;--mu:#93a0c4;--bd:#25305a;--ac:#4d7cff;--ac2:#ff4560}}
:root[data-theme="dark"]{--bg:#0b1226;--card:#141d3a;--tx:#eef2ff;--mu:#93a0c4;--bd:#25305a;--ac:#4d7cff;--ac2:#ff4560}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin:auto;padding:12px 12px 80px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mu);font-size:13px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
.tabs button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:10px;font:inherit;cursor:pointer;white-space:nowrap}
.tabs button.on,.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.mu{color:var(--mu);font-size:12px}.pts{font-weight:700;color:var(--ac)}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
.badge{background:var(--ac2);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.sm{padding:5px 9px;font-size:13px}
.bt{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.g6{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.g6 input{padding:6px 2px;text-align:center;margin:2px 0}
.hd{display:flex;gap:10px;align-items:center}.hd img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--ac2)}.dl{border-left:4px solid var(--ac2)}
.ed{border:1px dashed var(--ac);border-radius:10px;padding:8px;margin:8px 0}
</style></head><body>
<div class="hd"><img alt="BAMSSA" src="IMG_5672.jpeg"><div><h1>Bamssa Fantasy League</h1>
<div class="sub">Pick 15 players (11 + 4 subs) · choose your formation · £100m · max 3 per department · captain scores double</div></div></div>
<div id="app">Loading…</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,doc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBcns1OW82iioMRzdbBPJ2dOmNyRhVhgcQ",authDomain:"bamssa-fantasy-league.firebaseapp.com",projectId:"bamssa-fantasy-league",storageBucket:"bamssa-fantasy-league.firebasestorage.app",messagingSenderId:"644555872989",appId:"1:644555872989:web:be16b65ca48132983a5934"};
const ADMIN_PIN="2007",BUDGET=100,MAXD=3,END="Squad selection has ended";
const DEADLINE=new Date("2026-11-12T23:59:59+01:00").getTime();
const locked=()=>Date.now()>DEADLINE;
function left(){let m=Math.floor((DEADLINE-Date.now())/60000),d=Math.floor(m/1440),h=Math.floor(m%1440/60);return d+"d "+h+"h left"}
const DEPTS=["Pharmacy","Pharmacology","Physiology","MLS","Forensics","Anatomy","Nursing","Biochemistry"];
const POS=["GK","DEF","MID","FWD"],QUOTA={GK:2,DEF:5,MID:5,FWD:3};
const FORMS=["3-4-3","3-5-2","4-3-3","4-4-2","4-5-1","5-3-2","5-4-1"];
const GV={GK:10,DEF:10,MID:8,FWD:6},CSV={GK:6,DEF:6,MID:2,FWD:0};
const KEYS=["g","a","cs","ps","motm","ft","ht","pts"],LBL=["G","A","CS","PS","MOTM","FT","HT","±"];
let db,uid,players=[],mgrs=[],me=null,tab="team",admin=false,flt="All",fpos="All",ready=false,editId=null;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=id=>players.find(p=>p.id===id);
const pp=p=>(p.g||0)*GV[p.pos]+(p.a||0)*5+(p.cs||0)*CSV[p.pos]+(p.ps||0)*5+(p.motm||0)*5+(p.ft||0)*2+(p.ht||0)+(p.pts||0);
const FM=m=>(m.form||"4-4-2").split("-").map(Number);
function starters(m){return (m.squad||[]).filter(id=>!(m.bench||[]).includes(id)).map(P).filter(Boolean)}
function ok(m){const s=starters(m),c=k=>s.filter(p=>p.pos===k).length,[d,mi,f]=FM(m);return (m.squad||[]).length===15&&s.length===11&&c("GK")===1&&c("DEF")===d&&c("MID")===mi&&c("FWD")===f}
function score(m){return ok(m)?starters(m).reduce((t,p)=>t+pp(p)*(m.cap===p.id?2:1),0):0}
function cost(m){return (m.squad||[]).reduce((t,id)=>t+(P(id)?P(id).price:0),0)}
function arrange(form,m){const[d,mi,f]=form.split("-").map(Number),need={GK:1,DEF:d,MID:mi,FWD:f},st=[],bn=[];
  (m.squad||[]).map(P).filter(Boolean).sort((a,b)=>b.price-a.price).forEach(p=>{if(need[p.pos]>0){need[p.pos]--;st.push(p.id)}else bn.push(p.id)});
  return{bench:bn,cap:st.includes(m.cap)?m.cap:null}}
const bl=()=>{const f=document.activeElement;f&&f.blur&&f.blur()};
async function init(){
  try{
    db=getFirestore(initializeApp(firebaseConfig));
    uid=localStorage.getItem("bfl_uid");if(!uid){uid="u"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem("bfl_uid",uid)}
  }catch(e){$("#app").innerHTML='<div class="card">Setup error: check your Firebase config.</div>';return}
  const er=()=>{$("#app").innerHTML='<div class="card">Cannot reach the database. Check Firebase config and rules.</div>'};
  onSnapshot(collection(db,"players"),s=>{players=s.docs.map(d=>({id:d.id,...d.data()}));ready=true;render()},er);
  onSnapshot(collection(db,"managers"),s=>{mgrs=s.docs.map(d=>({id:d.id,...d.data()}));me=mgrs.find(m=>m.id===uid)||null;ready=true;render()},er);
}
async function save(patch){try{await setDoc(doc(db,"managers",uid),{...(me||{}),...patch})}catch(e){alert("Could not save, try again.")}}
function join(){if(locked())return alert(END);const n=$("#nm").value.trim(),d=$("#dp").value;if(!n)return alert("Enter your team name");bl();save({name:n,dept:d,squad:[],bench:[],cap:null,form:"4-4-2"})}
function toggle(id){if(locked())return alert(END);const sq=[...(me.squad||[])],bn=[...(me.bench||[])],i=sq.indexOf(id);
  if(i>=0){sq.splice(i,1);return save({squad:sq,bench:bn.filter(x=>x!==id),cap:me.cap===id?null:me.cap})}
  const p=P(id);if(sq.length>=15)return alert("Squad full (15 players)");
  const ps=sq.map(P).filter(Boolean);
  if(cost(me)+p.price>BUDGET)return alert("Over budget!");
  if(ps.filter(x=>x.pos===p.pos).length>=QUOTA[p.pos])return alert("You already have "+QUOTA[p.pos]+" "+p.pos);
  if(ps.filter(x=>x.dept===p.dept).length>=MAXD)return alert("Max "+MAXD+" players per department");
  sq.push(id);if(sq.length-bn.length>11)bn.push(id);save({squad:sq,bench:bn})}
function swap(id){if(locked())return alert(END);const bn=[...(me.bench||[])],i=bn.indexOf(id),st=(me.squad||[]).length-bn.length;
  if(i>=0){if(st>=11)return alert("Starting XI is full. Bench someone first.");bn.splice(i,1);return save({bench:bn})}
  if(bn.length>=4)return alert("Bench is full (4 subs). Start a sub first.");
  bn.push(id);save({bench:bn,cap:me.cap===id?null:me.cap})}
function cap(id){if(locked())return alert(END);if((me.bench||[]).includes(id))return alert("Captain must be in your starting XI");save({cap:id})}
function setForm(v){if(locked())return alert(END);save({form:v,...arrange(v,me)})}
function auto(){if(locked())return alert(END);save(arrange(me.form||"4-4-2",me))}
function pin(){if($("#pn").value===ADMIN_PIN){admin=true;render(true)}else alert("Wrong PIN")}
async function addP(){const n=$("#an").value.trim(),pr=parseFloat($("#ap").value);if(!n||!(pr>0))return alert("Fill name and price");bl();
  await addDoc(collection(db,"players"),{name:n,dept:$("#ad").value,pos:$("#apos").value,price:pr,g:0,a:0,cs:0,ps:0,motm:0,ft:0,ht:0,pts:0});$("#an").value=""}
async function saveStats(id){const o={};KEYS.forEach(k=>o[k]=parseFloat($("#"+k+id).value)||0);bl();await updateDoc(doc(db,"players",id),o)}
function editP(id){editId=id;render(true)}
function cancelEdit(){editId=null;render(true)}
async function saveEdit(id){const n=$("#en"+id).value.trim(),pr=parseFloat($("#ep"+id).value);if(!n||!(pr>0))return alert("Fill name and price");bl();
  await updateDoc(doc(db,"players",id),{name:n,dept:$("#ed"+id).value,pos:$("#eps"+id).value,price:pr});editId=null;render(true)}
async function delP(id){if(confirm("Delete player?"))await deleteDoc(doc(db,"players",id))}
function pc(p,btn){return `<div class="card row"><div><b>${esc(p.name)}</b> <span class="mu">${p.pos} · ${esc(p.dept)}</span><div class="mu">£${p.price}m · ${p.g||0}G ${p.a||0}A ${p.cs||0}CS ${p.ps||0}PS ${p.motm||0}MOTM ${p.ft||0}FT ${p.ht||0}HT · <span class="pts">${pp(p)} pts</span></div></div>${btn}</div>`}
function opts(list,sel){return `<option>All</option>`+list.map(d=>`<option ${sel===d?"selected":""}>${d}</option>`).join("")}
function sel(list,val){return list.map(d=>`<option ${val===d?"selected":""}>${d}</option>`).join("")}
function render(force){
  const a=$("#app");if(!db||!ready)return;
  const f=document.activeElement;if(!force&&f&&f.tagName==="INPUT"&&a.contains(f))return;
  const tb=[["team","My Team"],["players","Players"],["table","Table"],["admin","Admin"]].map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="setTab('${k}')">${l}</button>`).join("");
  let h=`<div class="tabs">${tb}</div>`;
  h+=locked()?'<div class="card dl">🔒 Squad selection has closed</div>':`<div class="card dl">⏳ Squad selection closes 12 Nov 2026 · ${left()}</div>`;
  if(tab==="team"){
    if(!me)h+=`<div class="card"><b>Create your team</b><input id="nm" placeholder="Team name" maxlength="24"><select id="dp">${DEPTS.map(d=>`<option>${d}</option>`).join("")}</select><button class="btn p" onclick="join()">Join league</button></div>`;
    else{const sq=me.squad||[],B=(me.bench||[]).map(P).filter(Boolean),S=starters(me).sort((x,y)=>POS.indexOf(x.pos)-POS.indexOf(y.pos)),fm=me.form||"4-4-2",[d,mi,fw]=FM(me);
      const msg=ok(me)?"✅ Squad complete":sq.length<15?"⚠ Pick "+(15-sq.length)+" more player(s). Incomplete squads score 0.":"⚠ "+fm+" needs 1 GK, "+d+" DEF, "+mi+" MID, "+fw+" FWD in your XI. Tap Auto-set XI.";
      h+=`<div class="card row"><div><b>${esc(me.name)}</b><div class="mu">${esc(me.dept)} · £${(BUDGET-cost(me)).toFixed(1)}m left · ${sq.length}/15</div><div class="mu">${msg}</div></div><div class="pts" style="font-size:22px">${score(me)}</div></div>`;
      h+=`<div class="row"><select onchange="setForm(this.value)">${FORMS.map(x=>`<option ${x===fm?"selected":""}>${x}</option>`).join("")}</select><button class="btn p sm" onclick="auto()">Auto-set XI</button></div>`;
      h+=`<div class="mu">STARTING XI · ${fm} (${S.length}/11)</div>`+(S.map(p=>pc(p,`<div class="bt">${me.cap===p.id?'<span class="badge">C</span>':`<button class="btn sm" onclick="cap('${p.id}')">Captain</button>`}<button class="btn sm" onclick="swap('${p.id}')">Bench</button><button class="btn sm" onclick="toggle('${p.id}')">✕</button></div>`)).join("")||'<div class="mu">No players yet. Open the Players tab.</div>');
      h+=`<div class="mu" style="margin-top:8px">SUBS (${B.length}/4)</div>`+(B.map(p=>pc(p,`<div class="bt"><button class="btn sm" onclick="swap('${p.id}')">Start</button><button class="btn sm" onclick="toggle('${p.id}')">✕</button></div>`)).join("")||'<div class="mu">No subs yet.</div>')}
  }
  if(tab==="players"){
    h+=`<div class="row"><select onchange="setFlt(this.value)">${opts(DEPTS,flt)}</select><select onchange="setPos(this.value)">${opts(POS,fpos)}</select></div>`;
    const l=players.filter(p=>(flt==="All"||p.dept===flt)&&(fpos==="All"||p.pos===fpos)).sort((a,b)=>b.price-a.price);
    h+=l.map(p=>{const inn=me&&(me.squad||[]).includes(p.id);return pc(p,me?`<button class="btn sm ${inn?"":"p"}" onclick="toggle('${p.id}')">${inn?"Remove":"Add"}</button>`:"")}).join("")||'<div class="mu">No players yet. The admin adds them.</div>'}
  if(tab==="table"){
    const r=[...mgrs].filter(m=>m.name).sort((a,b)=>score(b)-score(a));
    h+=`<div class="card"><b>Managers</b>`+(r.map((m,i)=>`<div class="row"><span>${i+1}. ${esc(m.name)}${ok(m)?"":" ⚠"} <span class="mu">${esc(m.dept)} · ${m.form||"4-4-2"}</span></span><span class="pts">${score(m)}</span></div>`).join("")||'<div class="mu">No managers yet</div>')+`<div class="mu">⚠ = incomplete squad (scores 0)</div></div>`;
    const d=DEPTS.map(x=>[x,mgrs.filter(m=>m.dept===x).reduce((t,m)=>t+score(m),0),mgrs.filter(m=>m.dept===x).length]).sort((a,b)=>b[1]-a[1]);
    h+=`<div class="card"><b>Department standings</b>`+d.map((x,i)=>`<div class="row"><span>${i+1}. ${x[0]} <span class="mu">${x[2]} mgrs</span></span><span class="pts">${x[1]}</span></div>`).join("")+`</div>`;
    h+=`<div class="card"><b>Scoring</b><div class="mu">Goal: GK/DEF 10, MID 8, FWD 6 · Assist 5 · Clean sheet: GK/DEF 6, MID 2 · MOTM 5 · Penalty save 5 · Playing time: full time 2, half time 1 · Captain x2 · Subs do not score</div></div>`}
  if(tab==="admin"){
    if(!admin)h+=`<div class="card"><b>Admin PIN</b><input id="pn" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN"><button class="btn p" onclick="pin()">Unlock</button></div>`;
    else{h+=`<div class="card"><b>Add player</b><input id="an" placeholder="Player name"><select id="ad">${DEPTS.map(d=>`<option>${d}</option>`).join("")}</select><select id="apos">${POS.map(d=>`<option>${d}</option>`).join("")}</select><input id="ap" type="number" step="0.5" placeholder="Price (£m)"><button class="btn p" onclick="addP()">Add</button></div><div class="card"><b>Player stats</b><div class="mu">Type each player's TOTALS: G goals, A assists, CS clean sheets, PS penalty saves, MOTM awards, FT full matches played, HT half matches played, ± extra points. Tap Save stats. Use Edit details to change name, department, position or price.</div></div>`;
      h+=players.map(p=>`<div class="card"><div class="row"><b>${esc(p.name)}</b><span class="mu">${p.pos} · ${esc(p.dept)} · £${p.price}m · ${pp(p)} pts</span></div>${editId===p.id?`<div class="ed"><div class="mu">Edit details</div><input id="en${p.id}" value="${esc(p.name)}" placeholder="Name"><select id="ed${p.id}">${sel(DEPTS,p.dept)}</select><select id="eps${p.id}">${sel(POS,p.pos)}</select><input id="ep${p.id}" type="number" step="0.5" value="${p.price}" placeholder="Price (£m)"><div class="row"><button class="btn p sm" onclick="saveEdit('${p.id}')">Save details</button><button class="btn sm" onclick="cancelEdit()">Cancel</button></div></div>`:""}<div class="g6">${KEYS.map((k,i)=>`<label class="mu">${LBL[i]}<input id="${k}${p.id}" type="number" value="${p[k]||0}"></label>`).join("")}</div><div class="row"><button class="btn p sm" onclick="saveStats('${p.id}')">Save stats</button><div class="bt"><button class="btn sm" onclick="editP('${p.id}')">Edit details</button><button class="btn sm" onclick="delP('${p.id}')">✕ Delete</button></div></div></div>`).join("")}
  }
  a.innerHTML=h;
}
function setTab(k){tab=k;render(true)}function setFlt(v){flt=v;render(true)}function setPos(v){fpos=v;render(true)}
Object.assign(window,{join,toggle,swap,cap,pin,addP,saveStats,delP,setTab,setFlt,setPos,setForm,auto,editP,cancelEdit,saveEdit});
init();
</script></body></html>
